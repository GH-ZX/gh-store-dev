name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Before setting up Node: `cache: pnpm` makes setup-node run pnpm to find
      # the store path, so pnpm has to exist by then. The other order fails with
      # "Unable to locate executable file: pnpm".
      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve dependency build scripts
        run: pnpm approve-builds --all

      # Before `check`, and its own step: a failing assertion should be named as
      # a failing test rather than found at the bottom of a lint-and-build log.
      # This ran nowhere until now — the suite existed and gated nothing.
      - name: Run tests
        run: pnpm test

      - name: Check application
        run: pnpm check

      - name: Build Cloudflare Worker
        run: pnpm exec opennextjs-cloudflare build
