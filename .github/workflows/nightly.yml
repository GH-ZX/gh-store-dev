# Nightly release checks.
#
# Two gaps that the push-gated CI cannot close:
#
#  * A **fresh apply** of every migration to an empty database, followed by the
#    pgTAP suites. Migrations are applied to staging and production by hand, as
#    an explicit release step, so nothing on the push path proves the set still
#    applies cleanly in order — a dependency added backwards is invisible until
#    release day. A local `supabase db reset` is exactly that proof, and it
#    needs no cloud project, which is why it runs here and not in CI.
#
#  * The **browser suite** (`pnpm test:e2e`). These drive a real store with a
#    real catalog: CI has no Supabase project, and wiring a push-gated run to
#    one would fail the pipeline for reasons unrelated to the commit. Nightly,
#    against staging, that trade is right — a failure names itself without
#    blocking anyone's push.
#
# The browser job runs only when repository secrets provide a staging project
# (`NEXT_PUBLIC_SUPABASE_URL` and `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY`), with
# `SUPABASE_URL` and `SUPABASE_PUBLISHABLE_KEY` accepted as fallback names. With
# no secrets the job skips with a notice instead of failing. Admin cases join
# automatically when `E2E_ADMIN_EMAIL` and `E2E_ADMIN_PASSWORD` are also set —
# the Playwright config owns that switch.
#
# `workflow_dispatch` runs everything on demand, so a release can re-prove the
# migration set and the storefront without waiting for the clock.

name: Nightly release checks

on:
  schedule:
    # 02:17 UTC daily — off the hour, so shared runners are not contended.
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every migration, in filename order, into an empty database. Then the pgTAP
  # identity and support suites against the result. A failure here is drift:
  # the migration set no longer describes a working database from scratch.
  sql:
    name: Fresh apply + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # db reset requires a running database. Only Postgres is needed for these
      # checks, so avoid starting unrelated API, Studio, and Edge services.
      - name: Start the disposable local database
        run: supabase db start

      # Replay every migration against an empty database without seed data.
      # Explicit --local keeps this check independent of any linked project.
      - name: Apply all migrations to a fresh local database
        run: supabase db reset --local --no-seed

      # The CLI enables pgTAP and uses pg_prove to validate assertions, test
      # plans, and SQL errors rather than matching formatted psql output.
      # The hosted suites in supabase/tests/hosted are deliberately absent:
      # they assert against a live project and belong to the release checklist,
      # not to a local run.
      - name: Run pgTAP suites
        run: |
          set -o pipefail
          supabase test db --local supabase/tests/rls/*.sql | tee /tmp/gh-store-pgtap.out
          # pg_prove can exit successfully with NOTESTS if no tests are found.
          grep -q '^Result: PASS$' /tmp/gh-store-pgtap.out

      - name: Remove the disposable local database
        if: always()
        run: supabase stop --no-backup

  # The full browser suite — anonymous storefront always, administrator flows
  # when the credentials secrets exist. Playwright uses its bundled Chromium
  # here; the config falls back to it when no channel is set.
  e2e:
    name: Browser suite (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: [sql]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            storefront/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir storefront install --frozen-lockfile

      - name: Approve dependency build scripts
        run: pnpm approve-builds --all

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Secrets cannot be read from `if:`, so their presence is resolved here
      # and every later step asks the output instead.
      - name: Check staging secrets
        id: staging
        env:
          STAGING_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$STAGING_URL" ] && [ -n "$STAGING_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging secrets are not set; the browser suite was skipped. Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY as repository secrets to enable it."
          fi

      - name: Run browser suite
        if: steps.staging.outputs.present == 'true'
        env:
          STAGING_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PORT: "5173"
        run: |
          # Worker bindings come from Wrangler, not the test process environment.
          # .dev.vars overrides checked-in production vars in local development.
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          function quoted(value) {
            if (!value || /['\r\n\0]/.test(value)) throw new Error("Invalid staging binding format");
            return `'${value}'`;
          }
          const bindings = {
            SUPABASE_URL: process.env.STAGING_URL,
            SUPABASE_PUBLISHABLE_KEY: process.env.STAGING_KEY,
            APP_URL: `http://127.0.0.1:${process.env.E2E_PORT}`,
          };
          const contents = Object.entries(bindings).map(([key, value]) => `${key}=${quoted(value)}`).join("\n") + "\n";
          writeFileSync("storefront/.dev.vars", contents, { mode: 0o600, flag: "wx" });
          NODE
          trap 'rm -f storefront/.dev.vars' EXIT
          pnpm test:e2e

      - name: Upload failure report
        if: failure() && steps.staging.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
